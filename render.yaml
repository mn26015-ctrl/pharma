services:
  - type: web
    name: pharmai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_PATH
        value: /var/data/pharmai.db
    disk:
      name: pharmai-data
      mountPath: /var/data
      sizeGB: 1
